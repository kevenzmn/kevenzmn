<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <title>kevenzmn</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="This is a simple webpage with a heading.">
   <link rel="shortcut icon" href="https://lh3.googleusercontent.com/a/ACg8ocI__Xp7t-3AONpJLg9XnplDLXzVpmqvY7mSFGFvXmOSDhMmCg=s360-c-no" type="image/png">
   <link rel="stylesheet" href="style.css">                
</head>

<body id="meuBody" style="
  font-family: sans-serif; 
  margin: 0; 
  min-height: 100vh; 
  display: flex; 
  flex-direction: column;
  justify-content: center; 
  align-items: center; 
  box-sizing: border-box;
  padding: 20px;
  background-color: #ffffff;
  color: #000000;
  transition: background-color 0.3s, color 0.3s;
">

  <!-- Container central com o número e o botão -->
  <div style="text-align: center;">
    <h1 id="textoEmail" style="
      font-size: clamp(2.2rem, 8vw, 4.5rem); 
      margin: 0 0 20px 0;
      word-break: keep-all;
    ">
      kevenzmn@gmail.com
    </h1>

    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px;">
      <button id="btnCaixaTexto" style="
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: bold;
        color: #333333;
        background-color: #e0e0e0;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      ">
        🔠 Mudar para MAIÚSCULAS
      </button>

      <button id="btnModoEscuro" style="
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: bold;
        color: #ffffff;
        background-color: #212121;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      ">
        🌙 Fundo Preto / Texto Branco
      </button>
    </div>

    <button id="btnTelaCheia" style="
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: opacity 0.2s;
      margin-top: 5px;
    ">
      📱 Expandir em Tela Cheia
    </button>
  </div>

  <footer id="meuFooter" style="
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 15px 0;
    background-color: white;
    transition: background-color 0.3s;
  ">
    <a id="linkHome" href="index.html" style="text-decoration: none; color: black; font-weight: bold; transition: color 0.3s;">HOME</a>
  </footer>

  <script>
    const btn = document.getElementById('btnTelaCheia');
    const btnCaixaTexto = document.getElementById('btnCaixaTexto');
    const btnModoEscuro = document.getElementById('btnModoEscuro');
    const textoEmail = document.getElementById('textoEmail');
    const body = document.getElementById('meuBody');
    const footer = document.getElementById('meuFooter');
    const linkHome = document.getElementById('linkHome');

    let isUppercase = false;
    let isDarkMode = false;

    // Alternar entre maiúsculas e minúsculas
    btnCaixaTexto.addEventListener('click', () => {
      isUppercase = !isUppercase;
      if (isUppercase) {
        textoEmail.style.textTransform = 'uppercase';
        btnCaixaTexto.textContent = '🔡 Mudar para minúsculas';
      } else {
        textoEmail.style.textTransform = 'none';
        btnCaixaTexto.textContent = '🔠 Mudar para MAIÚSCULAS';
      }
    });

    // Alternar modo escuro (fundo preto / texto branco)
    btnModoEscuro.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        body.style.backgroundColor = '#000000';
        body.style.color = '#ffffff';
        footer.style.backgroundColor = '#000000';
        linkHome.style.color = '#ffffff';
        btnModoEscuro.textContent = '☀️ Fundo Branco / Texto Preto';
        btnModoEscuro.style.backgroundColor = '#f0f0f0';
        btnModoEscuro.style.color = '#000000';
      } else {
        body.style.backgroundColor = '#ffffff';
        body.style.color = '#000000';
        footer.style.backgroundColor = '#ffffff';
        linkHome.style.color = '#000000';
        btnModoEscuro.textContent = '🌙 Fundo Preto / Texto Branco';
        btnModoEscuro.style.backgroundColor = '#212121';
        btnModoEscuro.style.color = '#ffffff';
      }
    });

    btn.addEventListener('click', () => {
      const elem = document.documentElement;
      
      // Entra em tela cheia
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
        elem.webkitRequestFullscreen();
      }
    });

    // Monitora a mudança de estado da Tela Cheia
    function checarTelaCheia() {
      const emTelaCheia = document.fullscreenElement || document.webkitFullscreenElement;
      
      if (emTelaCheia) {
        // Esconde o botão ao entrar em tela cheia
        btn.style.display = 'none';
      } else {
        // Exibe o botão novamente ao sair da tela cheia
        btn.style.display = 'inline-block';
      }
    }

    document.addEventListener('fullscreenchange', checarTelaCheia);
    document.addEventListener('webkitfullscreenchange', checarTelaCheia);
  </script>

</body>
</html>
